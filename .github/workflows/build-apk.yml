
name: Build Sundra Client CRM APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sundra_Client_CRM_Project.zip'
      - 'android-project/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/project"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          if [ -f Sundra_Client_CRM_Project.zip ]; then
            unzip -q Sundra_Client_CRM_Project.zip -d "$WORK"
          elif [ -d android-project ]; then
            cp -a android-project "$WORK/"
          else
            echo "::error::Project ZIP not found"
            exit 1
          fi

          ROOT="$(find "$WORK" -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -print | head -n 1 | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Fix Service Picker and Settings
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_ROOT/app/src/main/java/com/sundraedits/crm/ui" <<'PY'
          import sys
          import os

          src = sys.argv[1]
          glass = os.path.join(src, "Glass.kt")
          settings = os.path.join(src, "Settings.kt")

          if not os.path.exists(glass):
              print("Glass.kt not found - stopping")
              sys.exit(1)

          with open(glass, "r", encoding="utf-8") as f:
              text = f.read()

          start = text.find("fun <T> PickerSheet(")
          end = text.find("@Composable\nfun ConfirmDialog", start)

          if start == -1 or end == -1:
              print("PickerSheet markers not found")
              sys.exit(1)

          replacement = '''fun <T> PickerSheet(
              title: String,
              options: List<T>,
              selected: T?,
              label: (T) -> String,
              onPick: (T) -> Unit,
              onDismiss: () -> Unit,
              subtitle: (T) -> String? = { null },
              tint: (T) -> Color = { Color.Transparent }
          ) {
              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true),
                  containerColor = Ivory
              ) {
                  Column(
                      Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 20.dp)
                          .padding(bottom = 24.dp)
                          .navigationBarsPadding(),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text(title, style = MaterialTheme.typography.headlineSmall, color = Ink)

                      options.forEach { opt ->
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(24.dp))
                                  .background(tint(opt).copy(alpha = 0.55f))
                                  .clickable { onPick(opt) }
                                  .padding(20.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(Modifier.weight(1f)) {
                                  Text(
                                      label(opt),
                                      fontWeight = FontWeight.SemiBold,
                                      color = Ink
                                  )
                                  subtitle(opt)?.let {
                                      Text(it, fontSize = 12.sp, color = Taupe)
                                  }
                              }

                              if (opt == selected) {
                                  Icon(
                                      Icons.Default.Check,
                                      contentDescription = "Selected",
                                      tint = Gold
                                  )
                              }
                          }
                      }
                  }
              }
          }
      }

      '''

          text = text[:start] + replacement + text[end:]

          with open(glass, "w", encoding="utf-8") as f:
              f.write(text)

          print("Service picker updated")

          if os.path.exists(settings):
              with open(settings, "r", encoding="utf-8") as f:
                  s = f.read()

              if "import androidx.compose.ui.unit.dp" not in s:
                  s = s.replace(
                      "package com.sundraedits.crm.ui\n",
                      "package com.sundraedits.crm.ui\n\n"
                      "import androidx.compose.ui.unit.dp\n"
                  )

              with open(settings, "w", encoding="utf-8") as f:
                  f.write(s)

              print("Settings dp import checked")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_ROOT" -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK not found"
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/SundraEditsCRM-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SundraEditsCRM-debug-apk
          path: dist/SundraEditsCRM-debug.apk
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/project/**/build/reports/**
          if-no-files-found: warn

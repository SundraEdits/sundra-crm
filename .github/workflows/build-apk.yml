
name: Build Sundra Client CRM APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sundra_Client_CRM_Project.zip'
      - 'android-project/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/project"
          rm -rf "$WORK"
          mkdir -p "$WORK" "$GITHUB_WORKSPACE/build-logs"

          if [ -f Sundra_Client_CRM_Project.zip ]; then
            unzip -q Sundra_Client_CRM_Project.zip -d "$WORK"
          elif [ -d android-project ]; then
            cp -a android-project/. "$WORK/"
          else
            echo "::error::Project ZIP not found"
            exit 1
          fi

          ROOT="$(find "$WORK" -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -print | head -n 1 | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          if [ ! -f "$ROOT/app/build.gradle.kts" ] && [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "::error::App module not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Fix Kotlin and Service Picker
        shell: bash
        run: |
          set -euo pipefail

          GLASS="$PROJECT_ROOT/app/src/main/java/com/sundraedits/crm/ui/Glass.kt"
          SETTINGS="$PROJECT_ROOT/app/src/main/java/com/sundraedits/crm/ui/Settings.kt"

          python3 - "$GLASS" "$SETTINGS" <<'PY'
          import sys
          from pathlib import Path

          glass = Path(sys.argv[1])
          settings = Path(sys.argv[2])

          if not glass.exists():
              raise SystemExit("Glass.kt not found")

          text = glass.read_text(encoding="utf-8")

          # Fix unresolved matchParentSize reference
          text = text.replace(
              "import androidx.compose.foundation.layout.matchParentSize",
              ""
          )

          text = text.replace(
              ".matchParentSize()",
              ".fillMaxSize()"
          )

          # Add fillMaxSize import if needed
          if ".fillMaxSize()" in text and "import androidx.compose.foundation.layout.fillMaxSize" not in text:
              text = text.replace(
                  "import androidx.compose.foundation.layout.Box",
                  "import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.fillMaxSize",
                  1
              )

          # Improve service picker tap area
          old = "GlassCard(Modifier.fillMaxWidth(), onClick = { onPick(opt) }, tint = tint(opt)) {"

          new = "Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(24.dp)).background(tint(opt).copy(alpha = 0.55f)).clickable { onPick(opt) }.padding(16.dp)) {"

          if old in text:
              text = text.replace(old, new, 1)
              print("Service picker click patch applied")
          else:
              print("Service picker pattern not found; click patch skipped")

          glass.write_text(text, encoding="utf-8")

          # Settings dp import fix
          if settings.exists():
              s = settings.read_text(encoding="utf-8")

              if "import androidx.compose.ui.unit.dp" not in s:
                  s = s.replace(
                      "package com.sundraedits.crm.ui",
                      "package com.sundraedits.crm.ui\n\nimport androidx.compose.ui.unit.dp",
                      1
                  )

              settings.write_text(s, encoding="utf-8")

          print("Kotlin patch completed")
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/gradle-build.log"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_ROOT" -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/SundraEditsCRM-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SundraEditsCRM-debug-apk
          path: dist/SundraEditsCRM-debug.apk
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-logs/
            ${{ runner.temp }}/project/**/build/reports/**
          if-no-files-found: warn

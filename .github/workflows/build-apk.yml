
name: Build Sundra Client CRM APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sundra_Client_CRM_Project.zip'
      - 'android-project/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/project"
          rm -rf "$WORK"
          mkdir -p "$WORK" "$GITHUB_WORKSPACE/build-logs"

          if [ -f Sundra_Client_CRM_Project.zip ]; then
            unzip -q Sundra_Client_CRM_Project.zip -d "$WORK"
          elif [ -d android-project ]; then
            mkdir -p "$WORK/android-project"
            cp -a android-project/. "$WORK/android-project/"
          else
            echo "::error::Project ZIP missing"
            exit 1
          fi

          ROOT="$(find "$WORK" -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -print | head -n 1 | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "::error::Android project root not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Patch picker click target
        shell: bash
        run: |
          set -euo pipefail
          GLASS="$PROJECT_ROOT/app/src/main/java/com/sundraedits/crm/ui/Glass.kt"
          SETTINGS="$PROJECT_ROOT/app/src/main/java/com/sundraedits/crm/ui/Settings.kt"

          python3 - "$GLASS" "$SETTINGS" <<'PY'
          import sys
          from pathlib import Path

          glass = Path(sys.argv[1])
          settings = Path(sys.argv[2])

          s = glass.read_text(encoding="utf-8")

          old = 'GlassCard(Modifier.fillMaxWidth(), onClick = { onPick(opt) }, tint = tint(opt)) {'

          new = 'Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(24.dp)).background(tint(opt).copy(alpha = 0.55f)).clickable { onPick(opt) }.padding(16.dp)) {'

          if old not in s:
              raise SystemExit("Picker source pattern not found; no patch applied")

          glass.write_text(s.replace(old, new, 1), encoding="utf-8")

          if settings.exists():
              t = settings.read_text(encoding="utf-8")

              if "import androidx.compose.ui.unit.dp" not in t:
                  t = t.replace(
                      "package com.sundraedits.crm.ui\n",
                      "package com.sundraedits.crm.ui\n\nimport androidx.compose.ui.unit.dp\n",
                      1
                  )
                  settings.write_text(t, encoding="utf-8")

          print("Picker patch applied")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/gradle-build.log"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT" -path '*/build/outputs/apk/debug/*.apk' -print | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/SundraEditsCRM-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SundraEditsCRM-debug-apk
          path: dist/SundraEditsCRM-debug.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-logs/
            ${{ runner.temp }}/project/**/build/reports/**
          if-no-files-found: warn
